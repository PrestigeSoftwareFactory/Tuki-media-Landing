# Producción: app + PostgreSQL + Caddy (HTTPS automático).
#   1. cp .env.production.example .env.production  y completalo
#   2. docker compose --env-file .env.production up -d --build
#   3. docker compose --env-file .env.production exec app npm run create-admin -- vos@tudominio.com "ContraseñaSegura123"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuki
      POSTGRES_USER: tuki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuki -d tuki"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://tuki:${POSTGRES_PASSWORD}@db:5432/tuki?schema=public
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Definí DOMAIN en .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
